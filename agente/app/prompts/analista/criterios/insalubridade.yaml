# Catálogo fechado de critérios. Pesos, prazos de correção e fundamentos ficam aqui para
# revisão humana.
# TODO(revisão): rascunho inicial. Um advogado precisa confirmar os pesos, o sanavel_ate e a
# vigência de cada fundamento antes do uso com casos reais.
tema: insalubridade
versao: "0.1.0"
criterios:
  - id: agente_nocivo
    nome: Agente insalubre identificado e previsto na NR-15
    descricao: "O relato aponta o agente (físico, químico ou biológico) e ele consta da relação oficial."
    peso: 3
    sanavel_ate: instrucao
    fundamentos: ["CLT, arts. 189 e 190", "NR-15", "Súmula 448, I, do TST", "Súmula 293 do TST"]
  - id: prova_tecnica
    nome: Prova técnica da insalubridade
    descricao: "Há perícia favorável, ou outro meio de prova admitido quando a perícia não é possível."
    peso: 3
    sanavel_ate: instrucao
    fundamentos: ["CLT, art. 195, § 2º", "OJ 278 da SDI-1 do TST"]
  - id: exposicao
    nome: Exposição habitual ou intermitente demonstrada
    descricao: "A frequência e a forma da exposição estão descritas e têm prova."
    peso: 2
    sanavel_ate: instrucao
    fundamentos: ["Súmula 47 do TST", "NR-15"]
  - id: epi
    nome: Falta de EPI que neutralize o agente
    descricao: "Está demonstrado que o EPI não foi fornecido, não era adequado ou não teve o uso fiscalizado."
    peso: 2
    sanavel_ate: instrucao
    fundamentos: ["CLT, art. 191", "Súmulas 80 e 289 do TST"]
  - id: grau
    nome: Grau pedido compatível com a atividade
    descricao: "O pedido indica o grau (mínimo, médio ou máximo) e ele corresponde ao agente e à atividade."
    peso: 1
    sanavel_ate: inicial
    fundamentos: ["CLT, art. 192", "Súmula 448, II, do TST"]
  - id: periodo
    nome: Função e período delimitados dentro da prescrição
    descricao: "Funções, locais e datas da exposição estão delimitados e não alcançados pela prescrição."
    peso: 1
    sanavel_ate: inicial
    fundamentos: ["CF, art. 7º, XXIX", "CLT, art. 11"]
