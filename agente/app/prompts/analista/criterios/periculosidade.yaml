# Catálogo fechado de critérios. Pesos, prazos de correção e fundamentos ficam aqui para
# revisão humana.
# TODO(revisão): rascunho inicial. Um advogado precisa confirmar os pesos, o sanavel_ate e a
# vigência de cada fundamento antes do uso com casos reais.
tema: periculosidade
versao: "0.1.0"
criterios:
  - id: atividade_perigosa
    nome: Atividade enquadrada como perigosa
    descricao: "O relato aponta o risco (inflamáveis, explosivos, energia elétrica, violência, motocicleta ou outro previsto)."
    peso: 3
    sanavel_ate: instrucao
    fundamentos: ["CLT, art. 193", "NR-16"]
  - id: prova_tecnica
    nome: Prova técnica da periculosidade
    descricao: "Há perícia favorável, ou o pagamento espontâneo do adicional a dispensa."
    peso: 3
    sanavel_ate: instrucao
    fundamentos: ["CLT, art. 195, § 2º", "Súmula 453 do TST"]
  - id: exposicao
    nome: Exposição permanente ou intermitente demonstrada
    descricao: "O contato com o risco não é eventual nem por tempo extremamente reduzido, e há prova disso."
    peso: 2
    sanavel_ate: instrucao
    fundamentos: ["Súmula 364, I, do TST"]
  - id: area_risco
    nome: Permanência em área de risco demonstrada
    descricao: "O local de trabalho está dentro da área de risco definida para a atividade."
    peso: 2
    sanavel_ate: instrucao
    fundamentos: ["NR-16, anexos", "OJ 385 da SDI-1 do TST", "Súmula 447 do TST"]
  - id: base_calculo
    nome: Base de cálculo e opção de adicional definidas
    descricao: "O pedido indica a base correta e trata da opção entre insalubridade e periculosidade, se houver as duas."
    peso: 1
    sanavel_ate: inicial
    fundamentos: ["CLT, art. 193, §§ 1º e 2º", "Súmula 191 do TST"]
  - id: periodo
    nome: Função e período delimitados dentro da prescrição
    descricao: "Funções, locais e datas da exposição estão delimitados e não alcançados pela prescrição."
    peso: 1
    sanavel_ate: inicial
    fundamentos: ["CF, art. 7º, XXIX", "CLT, art. 11"]
