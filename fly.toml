app = "juripredict"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_DEBUG = "false"
  DJANGO_ALLOWED_HOSTS = "juripredict.fly.dev"
  CORS_ALLOW_ALL_ORIGINS = "false"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 75

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
