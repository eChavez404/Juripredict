          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/tokens/:
    get:
      operationId: auth_tokens_list
      description: |-
        Gerenciar tokens exige uma sessão de pessoa: um token de API nunca emite nem
        revoga tokens, nem os lista.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenApi'
          description: ''
    post:
      operationId: auth_tokens_create
      description: |-
        Gerenciar tokens exige uma sessão de pessoa: um token de API nunca emite nem
        revoga tokens, nem os lista.
      tags:
