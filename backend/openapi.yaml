          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
        required: true
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
      parameters:
      - in: header
        name: X-Escritorio-ID
        schema:
          type: string
          format: uuid
        description: Escritório ativo. Obrigatório quando o usuário pertence a mais
          de um.
  /api/v1/clientes/{id}/:
