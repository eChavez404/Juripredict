            application/json:
              schema:
                $ref: '#/components/schemas/Detalhe'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Revoga o refresh token no servidor.

        Não exige access token: quem sai por ele ter expirado também precisa
        conseguir encerrar a sessão. Resposta igual para token válido ou não.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
      parameters:
      - in: header
        name: X-Escritorio-ID
        schema:
          type: string
          format: uuid
        description: Escritório ativo. Obrigatório quando o usuário pertence a mais
          de um.
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioRequest'
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
      parameters:
      - in: header
        name: X-Escritorio-ID
        schema:
          type: string
          format: uuid
        description: Escritório ativo. Obrigatório quando o usuário pertence a mais
          de um.
  /api/v1/auth/me/excluir/:
    post:
