      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarResetSenhaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SolicitarResetSenhaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolicitarResetSenhaRequest'
        required: true
