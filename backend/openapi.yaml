openapi: 3.0.3
info:
  title: JuriPredict API
  version: 1.0.0
  description: |-
    API REST do JuriPredict: gestão de clientes, processos e agenda, com jurimetria da carteira, isolamento por escritório e controle de acesso por papel.

    Erros são devolvidos em JSON: 400 (dados inválidos), 401 (credencial ausente, inválida ou expirada), 403 (papel sem a capacidade exigida), 404 (recurso inexistente ou de outro escritório), 409 (exclusão de cliente com processos), 429 (limite de requisições) e 503 (DataJud sem chave configurada).
paths:
  /api/v1/auditoria/:
    get:
      operationId: auditoria_list
      tags:
      - auditoria
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoAuditoria'
          description: ''
      parameters:
      - in: header
        name: X-Escritorio-ID
        schema:
          type: string
          format: uuid
        description: Escritório ativo. Obrigatório quando o usuário pertence a mais
          de um.
  /api/v1/auditoria/{id}/:
    get:
      operationId: auditoria_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este evento auditoria.
        required: true
      - in: header
        name: X-Escritorio-ID
        schema:
          type: string
          format: uuid
        description: Escritório ativo. Obrigatório quando o usuário pertence a mais
          de um.
      tags:
      - auditoria
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoAuditoria'
          description: ''
  /api/v1/auth/convites/aceitar/:
    post:
      operationId: auth_convites_aceitar_create
      description: Endpoint sem login. O limite de requisições é por escopo, não o
        global.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceitarConviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AceitarConviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AceitarConviteRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
          description: ''
  /api/v1/auth/email/confirmar/:
    post:
      operationId: auth_email_confirmar_create
      description: Endpoint sem login. O limite de requisições é por escopo, não o
        global.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmarEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmarEmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detalhe'
          description: ''
  /api/v1/auth/email/reenviar/:
    post:
      operationId: auth_email_reenviar_create
      tags:
      - auth
      security:
