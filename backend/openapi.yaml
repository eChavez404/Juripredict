        description: Um valor inteiro único que identifica este cliente.
        required: true
      - in: header
        name: X-Escritorio-ID
        schema:
          type: string
          format: uuid
        description: Escritório ativo. Obrigatório quando o usuário pertence a mais
          de um.
      tags:
