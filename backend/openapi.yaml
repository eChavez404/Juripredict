components:
  schemas:
    AceitarConviteRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        senha:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        nome:
          type: string
          maxLength: 150
        aceite_termos:
          type: boolean
          default: false
      required:
      - senha
      - token
    AlterarSenhaRequest:
      type: object
      properties:
        senha_atual:
          type: string
          writeOnly: true
          minLength: 1
        nova_senha:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - nova_senha
      - senha_atual
    Andamento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        data_hora:
          type: string
          format: date-time
          readOnly: true
        codigo:
          type: integer
          readOnly: true
          nullable: true
        nome:
          type: string
          readOnly: true
        complemento:
          type: string
          readOnly: true
      required:
      - codigo
      - complemento
      - data_hora
      - id
      - nome
    AndamentoRecente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        processo:
          type: integer
          readOnly: true
        processo_numero:
          type: string
          readOnly: true
        data_hora:
          type: string
          format: date-time
          readOnly: true
        nome:
          type: string
          readOnly: true
      required:
      - data_hora
      - id
      - nome
      - processo
      - processo_numero
    AndamentosResposta:
      type: object
      properties:
        sincronizado_em:
          type: string
          format: date-time
          nullable: true
        andamentos:
          type: array
          items:
            $ref: '#/components/schemas/Andamento'
