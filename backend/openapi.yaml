  /api/v1/prazos/calcular/:
    get:
      operationId: prazos_calcular_retrieve
      description: 'Só calcula: não lê nem grava dado de escritório. Quem grava é
        a criação do compromisso.'
      parameters:
      - in: query
        name: area
        schema:
          enum:
          - TRABALHISTA
          - CIVEL
          - PREVIDENCIARIO
          - TRIBUTARIO
          - CRIMINAL
          - OUTRO
          type: string
          default: TRABALHISTA
          minLength: 1
        description: |-
          * `TRABALHISTA` - Trabalhista
          * `CIVEL` - Cível
          * `PREVIDENCIARIO` - Previdenciário
          * `TRIBUTARIO` - Tributário
          * `CRIMINAL` - Criminal
          * `OUTRO` - Outro
      - in: query
        name: data_base
        schema:
          type: string
          format: date
        description: Data da ciência, ou da disponibilização no diário eletrônico.
        required: true
      - in: query
        name: dias
        schema:
          type: integer
          maximum: 365
          minimum: 1
        required: true
      - in: query
        name: suspensoes
        schema:
          type: array
          items:
            type: string
            format: date
          maxItems: 120
        description: Dias sem expediente conferidos no calendário do tribunal.
      - in: query
        name: tipo
        schema:
          enum:
          - INTIMACAO
          - PUBLICACAO_DIARIO
          type: string
          default: INTIMACAO
          minLength: 1
        description: |-
          * `INTIMACAO` - Ciência direta do ato
          * `PUBLICACAO_DIARIO` - Disponibilização no diário eletrônico
      - in: header
        name: X-Escritorio-ID
        schema:
          type: string
          format: uuid
        description: Escritório ativo. Obrigatório quando o usuário pertence a mais
          de um.
      tags:
      - prazos
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrazoCalculoResposta'
          description: ''
