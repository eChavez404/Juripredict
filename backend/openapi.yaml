          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExcluirContaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExcluirContaRequest'
        required: true
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/exportar/:
    get:
      operationId: auth_me_exportar_retrieve
      tags:
      - auth
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: Cópia dos dados do titular.
          description: ''
  /api/v1/auth/password/:
    post:
      operationId: auth_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
          application/x-www-form-urlencoded:
            schema:
