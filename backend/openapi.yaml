              schema:
                $ref: '#/components/schemas/TokenApiCriado'
          description: ''
  /api/v1/auth/tokens/{token_id}/:
    delete:
      operationId: auth_tokens_destroy
      description: |-
        Gerenciar tokens exige uma sessão de pessoa: um token de API nunca emite nem
        revoga tokens, nem os lista.
      parameters:
      - in: path
        name: token_id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/clientes/:
    get:
      operationId: clientes_list
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Busca por nome ou e-mail.
      - in: header
        name: X-Escritorio-ID
        schema:
          type: string
          format: uuid
        description: Escritório ativo. Obrigatório quando o usuário pertence a mais
          de um.
      tags:
      - clientes
      security:
      - tokenApi: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
