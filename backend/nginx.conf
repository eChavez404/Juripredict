# Porta pública do contêiner: /mcp vai para o servidor MCP e o resto para o site.
# O iniciar.sh troca __PORTA__ pela porta que a hospedagem define.
#
# O site não repassa o /mcp por conta própria: o MCP consulta o site para responder, e duas
# chamadas simultâneas prenderiam os dois workers do gunicorn, um esperando o outro.
daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
# Abaixo de crit, o nginx registra a URL inteira, e a busca pode ter nome de cliente.
error_log stderr crit;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;

    # O processo não é root: só grava em /tmp.
    client_body_temp_path /tmp/nginx-corpo;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Acima do limite dos anexos (UPLOAD_MAX_MB), que o Django confere com mensagem própria.
    client_max_body_size 30m;

    # X-Forwarded-For e X-Forwarded-Proto da hospedagem seguem como vieram: acrescentar um
    # endereço aqui mudaria o IP que o limite de requisições enxerga (NUM_PROXIES).
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_read_timeout 75s;

    server {
        listen __PORTA__;

        location = /mcp {
            client_max_body_size 1m;
            proxy_buffering off;
            proxy_pass http://127.0.0.1:8002;
        }

        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass http://127.0.0.1:8002;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
