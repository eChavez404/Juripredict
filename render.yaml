databases:
  - name: juripredict-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: juripredict
    user: juripredict

services:
  - type: web
    name: juripredict
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: juripredict-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: juripredict.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://juripredict.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: USE_R2_STORAGE
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
