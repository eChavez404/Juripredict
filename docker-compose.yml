# A aplicação inteira, igual à produção: um contêiner (site, agente de IA e servidor MCP) e o
# PostgreSQL. Copie o .env.example para .env e preencha antes de subir. Acesse http://localhost:8080.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: juripredict_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d juripredict_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no arquivo .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Defina FIELD_ENCRYPTION_KEY no arquivo .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOW_ALL_ORIGINS: "false"
      DB_NAME: juripredict_db
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      DB_HOST: db
      DB_PORT: "5432"
      USE_R2_STORAGE: "false"
      # Opcionais: sem elas, o agente avisa e o acompanhamento pelo DataJud fica desligado.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX: ${PINECONE_INDEX:-}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
    volumes:
      # sem o R2, os documentos enviados ficam no disco do contêiner
      - media:/app/backend/juripredict/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media:
