name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django
        
    - name: Run Pytest
      run: |
        cd backend/juripredict
        # Exemplo: pytest
        # (O comando será descomentado assim que escrevermos o primeiro teste na pasta api/tests.py)
        echo "Pytest configurado e pronto para rodar!"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm install
        
    - name: Run Vitest / ESLint
      run: |
        cd frontend
        # Exemplo: npm run test
        # (Rodará Vitest quando adicionarmos o primeiro .test.tsx)
        npm run lint
