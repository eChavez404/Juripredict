name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataset:
    name: Dataset · testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar testes do dataset
        run: python -m pytest dataset/tests -q

  backend:
    name: Backend · Django
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: juripredict_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d juripredict_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/juripredict
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-django-secret-key-not-used-outside-tests
      FIELD_ENCRYPTION_KEY: ci-only-field-encryption-key-not-used-outside-tests
      DJANGO_ALLOWED_HOSTS: testserver,localhost
      CORS_ALLOW_ALL_ORIGINS: "false"
      DB_NAME: juripredict_db
      DB_USER: postgres
      DB_PASSWORD: ci-postgres-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r ../requirements.txt
      - name: Validar configuração
        run: python manage.py check
      - name: Verificar migrations pendentes
        run: python manage.py makemigrations --check --dry-run
      - name: Executar testes de negócio e segurança
        run: python manage.py test api.tests api.test_key_rotation organizations auditlog --verbosity=2
      - name: Validar migração dos dados existentes
        run: python manage.py test api.test_migrations --verbosity=2

  frontend:
    name: Frontend · React
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar lint
        run: npm run lint
      - name: Executar testes
        run: npm test
      - name: Gerar build de produção
        run: npm run build

  container:
    name: Deploy · imagem de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagem completa
        run: docker build --tag juripredict:ci .
